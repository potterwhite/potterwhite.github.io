    window.addEventListener('DOMContentLoaded', () => {
      new PagefindUI({
        element: '#search',
        showSubResults: true,
        showImages: false,
        translations: {
          placeholder: '搜索文章…',
          clear_search: '清除',
          load_more: '加载更多',
          search_label: '搜索',
          zero_results: '没有找到与 [SEARCH_TERM] 相关的内容',
          many_results: '找到 [COUNT] 条与 [SEARCH_TERM] 相关的内容',
          one_result: '找到 1 条与 [SEARCH_TERM] 相关的内容',
          alt_search: '没有找到相关内容，试试 [DIFFERENT_SEARCH]',
          search_suggestion: '试试 [SEARCH_TERM]',
          showing_results_for: '[SEARCH_TERM] 的搜索结果',
        },
      });

      // 防回退：与 UI 的 300ms debounce 对齐，逐词精确探测，不存在就不展示 UI 的宽松结果
      const root = document.getElementById('search');
      const zero = document.getElementById('pw-search-zero');
      const input = root.querySelector('.pagefind-ui__search-input');
      let corePromise = null;
      let timer = null;
      let seq = 0;

      const getCore = () => {
        if (!corePromise) {
          corePromise = import('/pagefind/pagefind.js').then(async (m) => {
            await m.init();
            return m;
          });
        }
        return corePromise;
      };

      const evaluate = async (raw) => {
        const q = raw.trim();
        const my = ++seq;
        if (!q) {
          zero.hidden = true;
          root.dataset.pwState = 'idle';
          return;
        }
        root.dataset.pwState = 'checking';
        const pf = await getCore();
        if (my !== seq) return;
        // 去掉 +/− 前缀（− 词是排除项，不要求存在）；用户自带引号的短语按原样探测
        const terms = q.split(/\s+/).filter(Boolean).map((t) => t.replace(/^[+-]/, ''));
        let ok = true;
        for (const t of terms) {
          const probe = /^".*"$/.test(t) ? t : `"${t}"`;
          const r = await pf.search(probe);
          if (my !== seq) return;
          if (r.results.length === 0) {
            ok = false;
            break;
          }
        }
        if (my !== seq) return;
        if (ok) {
          zero.hidden = true;
          root.dataset.pwState = 'valid';
        } else {
          zero.textContent = `没有找到与「${q}」相关的内容`;
          zero.hidden = false;
          root.dataset.pwState = 'invalid';
        }
      };

      input.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(() => evaluate(e.target.value), 300);
      });
    });
